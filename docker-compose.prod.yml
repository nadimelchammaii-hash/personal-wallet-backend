# Production stack. Lives in the backend repo, but also builds the
# frontend from a sibling checkout (../personal-wallet-frontend). Unlike
# docker-compose.yml (local dev — bind mounts, dev servers, phpMyAdmin),
# this builds the baked production images and puts a single Caddy
# container in front as the app's only public entry point: it serves the
# built frontend and reverse-proxies /api + /sanctum straight to the
# backend's PHP-FPM process. mysql and backend are not reachable from
# outside the Docker network at all — only "frontend" (Caddy) is.
#
# mysql.env.production holds real secrets and is never committed — on the
# server it lives one level up, alongside this repo's and the frontend
# repo's checkouts (see mysql.env.production.example for its shape).
#
# name: pinned to match the server's existing project name ("app", from
# this file's old standalone location at ~/app/docker-compose.prod.yml).
# Compose's default project name is derived from the compose file's own
# directory, so moving this file into the backend repo without pinning
# the name would make the next deploy create fresh volumes instead of
# reusing the real production database volume (app_wallet_mysql_data_prod).
name: app

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ../mysql.env.production
    volumes:
      - wallet_mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../personal-wallet-frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - wallet_caddy_data_prod:/data
      - wallet_caddy_config_prod:/config
    networks:
      default:
        # Fixed IP so the ufw-docker firewall rule (which allows traffic to
        # this exact address) survives container recreation - Docker does
        # not otherwise guarantee a container keeps the same internal IP
        # across restarts/rebuilds.
        ipv4_address: 172.28.10.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.10.0/24

volumes:
  wallet_mysql_data_prod:
  wallet_caddy_data_prod:
  wallet_caddy_config_prod:
